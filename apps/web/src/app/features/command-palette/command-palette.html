<div class="palette" (keydown)="onKeydown($event)">
  <div class="palette__search">
    <mat-icon class="palette__search-icon">search</mat-icon>
    <input
      class="palette__input"
      type="text"
      role="combobox"
      aria-expanded="true"
      aria-controls="palette-results"
      aria-label="Search agents, memory and prompts"
      placeholder="Search agents, memory and prompts…"
      autocomplete="off"
      spellcheck="false"
      cdkFocusInitial
      [value]="term()"
      (input)="onInput($any($event.target).value)"
    />
    <kbd class="palette__esc">esc</kbd>
  </div>

  <div class="palette__results" id="palette-results" role="listbox">
    @if (searching() && !results().length) {
      <div class="palette__loading">
        @for (row of [1, 2, 3]; track row) {
          <div class="palette__skeleton">
            <gb-skeleton width="1rem" height="1rem" radius="4px" />
            <gb-skeleton [width]="row === 2 ? '40%' : '60%'" />
          </div>
        }
      </div>
    } @else if (!items().length) {
      <p class="palette__empty">
        Nothing matches <span class="mono">{{ term() }}</span
        >.
      </p>
    } @else {
      @for (group of groups(); track group.name) {
        <div class="palette__group">
          <p class="palette__group-name">{{ group.name }}</p>

          @for (item of group.items; track item.id) {
            <button
              class="palette__item"
              role="option"
              [attr.aria-selected]="indexOf(item) === activeIndex()"
              [class.palette__item--active]="indexOf(item) === activeIndex()"
              (mouseenter)="activeIndex.set(indexOf(item))"
              (click)="run(item)"
            >
              <mat-icon class="palette__item-icon">{{ item.icon }}</mat-icon>
              <span class="palette__item-text">
                <span class="palette__item-label">{{ item.label }}</span>
                @if (item.hint) {
                  <span class="palette__item-hint">{{ item.hint }}</span>
                }
              </span>
              <mat-icon class="palette__item-go">arrow_forward</mat-icon>
            </button>
          }
        </div>
      }
    }
  </div>

  <footer class="palette__footer">
    <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
    <span><kbd>↵</kbd> open</span>
  </footer>
</div>
