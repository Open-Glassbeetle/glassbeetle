<mat-toolbar class="topbar">
  <button
    matIconButton
    class="topbar__menu"
    aria-label="Toggle navigation"
    (click)="toggleDrawer()"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <a class="brand" routerLink="/dashboard">
    <mat-icon class="brand__mark">pest_control</mat-icon>
    <span class="brand__name">Glassbeetle</span>
  </a>

  <span class="spacer"></span>

  <app-api-status-indicator />

  <button
    matIconButton
    [attr.aria-label]="'Switch to ' + (themeMode() === 'dark' ? 'light' : 'dark') + ' theme'"
    [matTooltip]="themeMode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleTheme()"
  >
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="layout" [hasBackdrop]="drawerMode() === 'over'">
  <mat-sidenav
    class="drawer"
    [mode]="drawerMode()"
    [opened]="drawerOpen()"
    (openedChange)="drawerOpen.set($event)"
  >
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          [activated]="link.isActive"
          (click)="onNavigate()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
