version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    # One weekly batch and a five-PR cap keep three workspaces current without
    # turning the issue tracker into a dependency-update queue.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    # The committed lockfile is the update baseline. Every generated lockfile
    # change must pass `npm ci --engine-strict` on the Node version in .nvmrc.
    # Avoid changing manifest ranges when the existing range permits an update.
    versioning-strategy: "increase-if-necessary"
    groups:
      angular:
        patterns:
          - "@angular/*"
      # Group routine NestJS updates; leave majors ungrouped for individual
      # review.
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - "minor"
          - "patch"
      # Group routine Tauri JavaScript updates; leave majors ungrouped for
      # individual review.
      tauri-js:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - "minor"
          - "patch"
      # Group routine Vitest updates; leave majors ungrouped for individual
      # review.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep Angular on 21 until a separate major migration is discussed and
      # tested, even though the supported Node version permits newer Angular.
      - dependency-name: "@angular/*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    # Cargo is checked weekly, but no more than two PRs stay open because the
    # Rust desktop shell is not compiled by CI yet (see issue #109).
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    groups:
      # Group routine Cargo updates; leave majors ungrouped for individual
      # review.
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Keep action updates together and stagger them from npm updates.
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
